version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    build: ../../backend
    env_file:
      - ../../backend/.env
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis

  frontend:
    build: ../../frontend
    env_file:
      - ../../frontend/.env
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
